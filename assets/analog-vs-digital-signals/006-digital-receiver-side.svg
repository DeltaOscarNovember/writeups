<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="680" height="460" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Goggles / ground station side</text>
  <text x="340" y="58" text-anchor="middle" font-size="11" fill="#666">← signal arrives</text>
  <line x1="340" y1="64" x2="340" y2="88" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="80" width="620" height="170" rx="12" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="46" y="96" font-size="11" fill="#888">RF / modem layer</text>

  <rect x="190" y="90" width="300" height="56" rx="8" fill="#f3f3f3" stroke="#888" stroke-width="1"/>
  <text x="340" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">RF front-end</text>
  <text x="340" y="131" text-anchor="middle" font-size="10" fill="#555">Antenna diversity + LNA</text>

  <line x1="340" y1="146" x2="340" y2="184" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="170" y="186" width="340" height="56" rx="8" fill="#e6f7f1" stroke="#1D9E75" stroke-width="1"/>
  <text x="340" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">OFDM demodulator</text>
  <text x="340" y="227" text-anchor="middle" font-size="10" fill="#555">Recover subcarriers, remove noise</text>

  <line x1="340" y1="242" x2="340" y2="280" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="282" width="300" height="56" rx="8" fill="#e6f7f1" stroke="#1D9E75" stroke-width="1"/>
  <text x="340" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">FEC decoder</text>
  <text x="340" y="323" text-anchor="middle" font-size="10" fill="#555">Correct lost / corrupted packets</text>

  <line x1="340" y1="338" x2="340" y2="376" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="368" width="620" height="80" rx="12" fill="none" stroke="#ddd" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="46" y="384" font-size="11" fill="#888">Display pipeline</text>

  <rect x="200" y="378" width="280" height="56" rx="8" fill="#f1efff" stroke="#534AB7" stroke-width="1"/>
  <text x="340" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Video decoder</text>
  <text x="340" y="419" text-anchor="middle" font-size="10" fill="#555">Reconstruct H.264 / H.265</text>

  <line x1="340" y1="434" x2="340" y2="452" stroke="#888" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
