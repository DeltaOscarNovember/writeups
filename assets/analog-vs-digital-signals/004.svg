<svg width="680" height="320" viewBox="0 0 680 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <rect width="680" height="320" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Left panel: Analog -->
  <rect x="20" y="20" width="300" height="260" rx="12" fill="none" stroke="#ddd" stroke-width="1"/>
  <text x="170" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Analog</text>
  <text x="170" y="64" text-anchor="middle" font-size="11" fill="#666">Continuous waveform</text>

  <line x1="50" y1="80" x2="50" y2="250" stroke="#999" stroke-width="1"/>
  <line x1="50" y1="250" x2="300" y2="250" stroke="#999" stroke-width="1"/>
  <text x="42" y="167" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90,42,167)">Amplitude</text>
  <text x="175" y="268" text-anchor="middle" font-size="10" fill="#666">Time →</text>

  <path d="M50,165 C68,165 72,92 90,92 C108,92 112,238 130,238 C148,238 152,92 170,92 C188,92 192,238 210,238 C228,238 232,92 250,92 C268,92 272,165 290,165" fill="none" stroke="#534AB7" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right panel: Digital -->
  <rect x="360" y="20" width="300" height="260" rx="12" fill="none" stroke="#ddd" stroke-width="1"/>
  <text x="510" y="48" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Digital</text>
  <text x="510" y="64" text-anchor="middle" font-size="11" fill="#666">Sampled &amp; quantized</text>

  <line x1="390" y1="80" x2="390" y2="250" stroke="#999" stroke-width="1"/>
  <line x1="390" y1="250" x2="640" y2="250" stroke="#999" stroke-width="1"/>
  <text x="382" y="167" text-anchor="middle" font-size="10" fill="#666" transform="rotate(-90,382,167)">Amplitude</text>
  <text x="515" y="268" text-anchor="middle" font-size="10" fill="#666">Time →</text>

  <path d="M390,165 L420,165 L420,105 L450,105 L450,95 L480,95 L480,210 L510,210 L510,240 L540,240 L540,95 L570,95 L570,100 L600,100 L600,165 L630,165" fill="none" stroke="#1D9E75" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="420" cy="105" r="3.5" fill="#1D9E75"/>
  <circle cx="450" cy="95"  r="3.5" fill="#1D9E75"/>
  <circle cx="480" cy="210" r="3.5" fill="#1D9E75"/>
  <circle cx="510" cy="240" r="3.5" fill="#1D9E75"/>
  <circle cx="540" cy="95"  r="3.5" fill="#1D9E75"/>
  <circle cx="570" cy="100" r="3.5" fill="#1D9E75"/>
  <circle cx="600" cy="165" r="3.5" fill="#1D9E75"/>

  <line x1="420" y1="250" x2="420" y2="256" stroke="#999" stroke-width="1"/>
  <line x1="450" y1="250" x2="450" y2="256" stroke="#999" stroke-width="1"/>
  <line x1="480" y1="250" x2="480" y2="256" stroke="#999" stroke-width="1"/>
  <line x1="510" y1="250" x2="510" y2="256" stroke="#999" stroke-width="1"/>
  <line x1="540" y1="250" x2="540" y2="256" stroke="#999" stroke-width="1"/>
  <line x1="570" y1="250" x2="570" y2="256" stroke="#999" stroke-width="1"/>
  <text x="422" y="268" text-anchor="middle" font-size="10" fill="#666">samples</text>

  <line x1="480" y1="140" x2="480" y2="210" stroke="#BA7517" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="488" y="178" font-size="10" fill="#BA7517">quantization</text>
  <text x="488" y="190" font-size="10" fill="#BA7517">error</text>
</svg>
